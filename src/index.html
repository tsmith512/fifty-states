<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="https://cloud.typography.com/6795652/7502032/css/fonts.css" />
  <link rel="stylesheet" href="scss/style.scss" />
  <title>Fifty States</title>
</head>
<body>

  <header>
    <a href="https://tsmith.com">
      <include src="gfx/logo.svg" />
    </a>
  </header>

  <div id="map">
    <include src="gfx/map.svg"/>
  </div>

  <main>
    <div class="slide" id="total">
      <div id="progress-container">
        <include src="gfx/progress.svg"/>
      </div>
      <span class="number" id="count">0</span>
      <span class="subtitle">States</span>
    </div>

    <div class="slide" id="top5">
      <span class="subtitle">Top 5</span>
      <ol id="states-list"></ol>
    </div>
  </main>

  <footer>
    <div id="scrollbar"><div id="scrolldot"></div></div>
  </footer>
  <script src="ts/script.ts"></script>
</body>
</html>
